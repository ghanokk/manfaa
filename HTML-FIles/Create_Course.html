<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../styles/auth.css">
  <link rel="stylesheet" href="../styles/create_course.css">
  <title>Create Course</title>
</head>
<body>
  <a href="HomePage.html" class="back-btn">← Back</a>

  <div class="auth-wrapper">
    <div class="auth-box">
      <h2>Create Course</h2>

      <!-- Success / error messages will be shown by the server (if used) -->
      <div id="messages" aria-live="polite"></div>

      <form action="create_course.php" method="POST" enctype="multipart/form-data">
        <label>Title</label>
        <input type="text" name="title" required value="">

        <label>Description</label>
        <textarea name="description" rows="6" required></textarea>

        <div class="form-row">
          <div>
            <label>Price (USD)</label>
            <input type="number" step="0.01" name="price" min="0" required>
          </div>
          <div>
            <label>Level</label>
            <select name="level">
              <option value="beginner">Beginner</option>
              <option value="intermediate">Intermediate</option>
              <option value="advanced">Advanced</option>
            </select>
          </div>
        </div>

        <label>Image (optional, JPG/PNG/WebP ≤ 2MB)</label>
        <input type="file" name="image" accept="image/*">

        <button class="btn primary" type="submit">Create Course</button>
      </form>
    </div>
  </div>
</body>
</html>
